<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle (Optional, good for favicon) -->
  <circle cx="256" cy="256" r="240" fill="#0F172A" />

  <!-- Pure Sine Wave Path -->
  <path 
    d="M 100 256 C 150 120, 200 120, 256 256 C 312 392, 362 392, 412 256" 
    fill="none" 
    stroke="url(#blueGradient)" 
    stroke-width="40" 
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Energy/Lightning Accent -->
  <path 
    d="M 230 180 L 290 180 L 250 250 L 310 250 L 220 380 L 245 280 L 180 280 Z" 
    fill="url(#orangeGradient)"
    transform="scale(0.8) translate(65, 50)"
    filter="url(#glow)"
  />
</svg>